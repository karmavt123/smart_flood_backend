# Cấu hình broker MQTT Mosquitto (docker-compose.yml dùng file này).
# Bắt buộc đăng nhập; mỗi tài khoản chỉ được làm đúng việc của mình (xem file acl).

listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl

# Giữ tin nhắn QoS 1 khi backend tạm tắt, bật lại sẽ nhận bù.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
